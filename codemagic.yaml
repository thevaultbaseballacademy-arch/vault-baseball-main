workflows:
  android-release:
    name: VAULT OS Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - vault_keystore
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
      node: 22.11.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Patch all fixes
        script: |
          python3 -c "open('capacitor.config.ts','w').write('import type { CapacitorConfig } from \"@capacitor/cli\";\nconst config: CapacitorConfig = {\n  appId: \"com.vaultbaseball.os\",\n  appName: \"VAULT OS\",\n  webDir: \"dist\",\n  server: { androidScheme: \"https\", iosScheme: \"app\", hostname: \"vaultos\" },\n  plugins: {\n    PushNotifications: { presentationOptions: [\"badge\", \"sound\", \"alert\"] },\n    NativeBiometric: { useFallback: true },\n    SplashScreen: { launchShowDuration: 2000, launchAutoHide: true, backgroundColor: \"#0d0d0d\", androidScaleType: \"CENTER_CROP\", showSpinner: false },\n    StatusBar: { style: \"Dark\", backgroundColor: \"#0d0d0d\" },\n  },\n  ios: { scheme: \"App\", contentInset: \"automatic\", backgroundColor: \"#0d0d0d\", preferredContentMode: \"mobile\", limitsNavigationsToAppBoundDomains: false, allowsLinkPreview: false },\n  android: { allowMixedContent: false, backgroundColor: \"#0d0d0d\", captureInput: true, webContentsDebuggingEnabled: false },\n};\nexport default config;\n')"
          echo "capacitor.config.ts rewritten"
          python3 -c "open('src/components/ui/sonner.tsx','w').write('import { Toaster as Sonner, toast } from \"sonner\";\ntype ToasterProps = React.ComponentProps<typeof Sonner>;\nconst Toaster = ({ ...props }: ToasterProps) => {\n  return (\n    <Sonner\n      theme=\"dark\"\n      className=\"toaster group\"\n      toastOptions={{\n        classNames: {\n          toast: \"group toast group-[.toaster]:bg-background group-[.toaster]:text-foreground group-[.toaster]:border-border group-[.toaster]:shadow-lg\",\n          description: \"group-[.toast]:text-muted-foreground\",\n          actionButton: \"group-[.toast]:bg-primary group-[.toast]:text-primary-foreground\",\n          cancelButton: \"group-[.toast]:bg-muted group-[.toast]:text-muted-foreground\",\n        },\n      }}\n      {...props}\n    />\n  );\n};\nexport { Toaster, toast };\n')"
          echo "sonner.tsx patched"
          python3 -c "
import re
content = open('index.html').read()
content = re.sub(r'<link rel=\"preconnect\" href=\"https://fonts\.googleapis\.com\"[^>]*/>\s*', '', content)
content = re.sub(r'<link rel=\"preconnect\" href=\"https://fonts\.gstatic\.com\"[^>]*/>\s*', '', content)
content = re.sub(r'<link href=\"https://fonts\.googleapis\.com[^>]*/>\s*', '', content)
open('index.html', 'w').write(content)
print('index.html Google Fonts removed')
"
          python3 -c "
content = open('src/App.tsx').read()
content = content.replace('import { Toaster as Sonner } from \"@/components/ui/sonner\";', '')
content = content.replace('import { Toaster as Sonner } from \"@/components/ui/sonner\"', '')
content = content.replace('        <Sonner />', '')
content = content.replace('        <Sonner/>', '')
open('src/App.tsx', 'w').write(content)
print('App.tsx Sonner removed')
"
          grep "isLoading" src/contexts/SubscriptionContext.tsx && sed -i "s/const \[isLoading, setIsLoading\] = useState(true)/const [isLoading, setIsLoading] = useState(false)/" src/contexts/SubscriptionContext.tsx
          grep "useState(true)" src/contexts/SportContext.tsx && sed -i "s/const \[loading, setLoading\] = useState(true)/const [loading, setLoading] = useState(false)/" src/contexts/SportContext.tsx
          sed -i "s/loading: true,/loading: false,/" src/contexts/SportContext.tsx
          grep "isChecking" src/hooks/useBiometricAuth.ts && sed -i "s/isChecking: true,/isChecking: false,/" src/hooks/useBiometricAuth.ts
          echo "=== Verify capacitor config ==="
          head -3 capacitor.config.ts
          echo "=== Verify sonner ==="
          head -1 src/components/ui/sonner.tsx
          echo "=== Verify index.html ==="
          grep -c "googleapis" index.html || echo "0 googleapis references - clean"
          echo "=== Verify App.tsx ==="
          grep -c "Sonner" src/App.tsx || echo "0 Sonner references - clean"
          echo "All patches done"
      - name: Build web app
        script: |
          export VITE_SUPABASE_URL="https://hhvdxkxaiauzikavtpuj.supabase.co"
          export VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8"
          CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Java version
        script: |
          export JAVA_HOME=$CM_JAVA_HOME
          java -version
      - name: Build Android AAB
        script: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode 9/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.8"/' app/build.gradle
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - Emejia2291@gmail.com
        notify:
          success: true
          failure: true

  ios-app-store:
    name: VAULT OS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VAULT_OS
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      node: 22.11.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Patch all fixes
        script: |
          python3 -c "open('capacitor.config.ts','w').write('import type { CapacitorConfig } from \"@capacitor/cli\";\nconst config: CapacitorConfig = {\n  appId: \"com.vaultbaseball.os\",\n  appName: \"VAULT OS\",\n  webDir: \"dist\",\n  server: { androidScheme: \"https\", iosScheme: \"app\", hostname: \"vaultos\" },\n  plugins: {\n    PushNotifications: { presentationOptions: [\"badge\", \"sound\", \"alert\"] },\n    NativeBiometric: { useFallback: true },\n    SplashScreen: { launchShowDuration: 2000, launchAutoHide: true, backgroundColor: \"#0d0d0d\", androidScaleType: \"CENTER_CROP\", showSpinner: false },\n    StatusBar: { style: \"Dark\", backgroundColor: \"#0d0d0d\" },\n  },\n  ios: { scheme: \"App\", contentInset: \"automatic\", backgroundColor: \"#0d0d0d\", preferredContentMode: \"mobile\", limitsNavigationsToAppBoundDomains: false, allowsLinkPreview: false },\n  android: { allowMixedContent: false, backgroundColor: \"#0d0d0d\", captureInput: true, webContentsDebuggingEnabled: false },\n};\nexport default config;\n')"
          echo "capacitor.config.ts rewritten"
          python3 -c "open('src/components/ui/sonner.tsx','w').write('import { Toaster as Sonner, toast } from \"sonner\";\ntype ToasterProps = React.ComponentProps<typeof Sonner>;\nconst Toaster = ({ ...props }: ToasterProps) => {\n  return (\n    <Sonner\n      theme=\"dark\"\n      className=\"toaster group\"\n      toastOptions={{\n        classNames: {\n          toast: \"group toast group-[.toaster]:bg-background group-[.toaster]:text-foreground group-[.toaster]:border-border group-[.toaster]:shadow-lg\",\n          description: \"group-[.toast]:text-muted-foreground\",\n          actionButton: \"group-[.toast]:bg-primary group-[.toast]:text-primary-foreground\",\n          cancelButton: \"group-[.toast]:bg-muted group-[.toast]:text-muted-foreground\",\n        },\n      }}\n      {...props}\n    />\n  );\n};\nexport { Toaster, toast };\n')"
          echo "sonner.tsx patched"
          python3 -c "
import re
content = open('index.html').read()
content = re.sub(r'<link rel=\"preconnect\" href=\"https://fonts\.googleapis\.com\"[^>]*/>\s*', '', content)
content = re.sub(r'<link rel=\"preconnect\" href=\"https://fonts\.gstatic\.com\"[^>]*/>\s*', '', content)
content = re.sub(r'<link href=\"https://fonts\.googleapis\.com[^>]*/>\s*', '', content)
open('index.html', 'w').write(content)
print('index.html Google Fonts removed')
"
          python3 -c "
content = open('src/App.tsx').read()
content = content.replace('import { Toaster as Sonner } from \"@/components/ui/sonner\";', '')
content = content.replace('import { Toaster as Sonner } from \"@/components/ui/sonner\"', '')
content = content.replace('        <Sonner />', '')
content = content.replace('        <Sonner/>', '')
open('src/App.tsx', 'w').write(content)
print('App.tsx Sonner removed')
"
          grep "isLoading" src/contexts/SubscriptionContext.tsx && sed -i "s/const \[isLoading, setIsLoading\] = useState(true)/const [isLoading, setIsLoading] = useState(false)/" src/contexts/SubscriptionContext.tsx
          grep "useState(true)" src/contexts/SportContext.tsx && sed -i "s/const \[loading, setLoading\] = useState(true)/const [loading, setLoading] = useState(false)/" src/contexts/SportContext.tsx
          sed -i "s/loading: true,/loading: false,/" src/contexts/SportContext.tsx
          grep "isChecking" src/hooks/useBiometricAuth.ts && sed -i "s/isChecking: true,/isChecking: false,/" src/hooks/useBiometricAuth.ts
          echo "=== Verify capacitor config ==="
          head -3 capacitor.config.ts
          echo "=== Verify sonner ==="
          head -1 src/components/ui/sonner.tsx
          echo "=== Verify index.html ==="
          grep -c "googleapis" index.html || echo "0 googleapis references - clean"
          echo "=== Verify App.tsx ==="
          grep -c "Sonner" src/App.tsx || echo "0 Sonner references - clean"
          echo "All patches done"
      - name: Build web app
        script: |
          export VITE_SUPABASE_URL="https://hhvdxkxaiauzikavtpuj.supabase.co"
          export VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8"
          CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Create dist if missing
        script: |
          if [ ! -d "dist" ]; then
            mkdir -p dist
            echo "<html><body></body></html>" > dist/index.html
          fi
      - name: Add iOS
        script: npx cap add ios
      - name: Sync iOS
        script: npx cap sync ios
      - name: Set app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cp public/icons/icon-1024x1024.png "$ICON_DIR/icon-1024x1024.png"
          echo '{"images":[{"filename":"icon-1024x1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON_DIR/Contents.json"
          echo "Icon set"
      - name: Set export compliance
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "Export compliance set"
      - name: Configure iOS permissions
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'VAULT OS uses your camera for training videos and coach analysis.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'VAULT OS uses your camera for training videos and coach analysis.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'VAULT OS uses your microphone during live remote coaching sessions.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'VAULT OS uses your microphone during live remote coaching sessions.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'VAULT OS accesses your photo library to upload training videos and profile photos.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'VAULT OS accesses your photo library to upload training videos and profile photos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'VAULT OS uses Face ID for secure fast login.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'VAULT OS uses Face ID for secure fast login.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" 2>/dev/null || true
          echo "iOS permissions configured"
      - name: Install provisioning profile
        script: |
          PROFILE_PATH=$(find /Users/builder/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -1)
          echo "Found profile: $PROFILE_PATH"
          UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 "<key>UUID</key>" | tail -1 | sed 's/.*<string>//;s/<\/string>//')
          echo "UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> $CM_ENV
      - name: Build iOS
        script: |
          KEY_PATH=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/@file://')
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM=6L8J9ZP8RL \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
          mkdir -p $CM_BUILD_DIR/ipa
          find /Users/builder -name "*.ipa" -exec cp {} $CM_BUILD_DIR/ipa/ \; 2>/dev/null || true
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
