workflows:
  android-release:
    name: VAULT OS Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - vault_keystore
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
      node: 22.11.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Java version
        script: |
          export JAVA_HOME=$CM_JAVA_HOME
          java -version
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - emejia2291@gmail.com
        notify:
          success: true
          failure: true
  ios-app-store:
    name: VAULT OS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "VAULT OS"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      node: 22.11.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Create dist if missing
        script: |
          if [ ! -d "dist" ]; then
            mkdir -p dist
            echo "<html><body></body></html>" > dist/index.html
          fi
      - name: Add iOS
        script: npx cap add ios
      - name: Sync iOS
        script: npx cap sync ios
      - name: - name: Build iOS
        script: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROVISIONING_PROFILE_SPECIFIER" \
            CODE_SIGN_IDENTITY="$CM_CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM=6L8J9ZP8RL
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
