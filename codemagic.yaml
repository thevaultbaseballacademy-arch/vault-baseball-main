workflows:
  android-release:
    name: VAULT OS Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - vault_keystore
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
      node: 20.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set up signing
        script: |
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/gradle.properties
          echo "storePassword=$CM_KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/gradle.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/gradle.properties
      - name: Update build.gradle for signing
        script: |
          cat >> android/app/build.gradle << 'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file(System.getProperty("user.home") + "/.android/vault_keystore.jks")
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE
      - name: Build signed Android AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - emejia2291@gmail.com
        notify:
          success: true
          failure: true
  ios-app-store:
    name: VAULT OS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VAULT_APP_STORE_CONNECT
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add iOS
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install pods
        script: cd ios/App && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
