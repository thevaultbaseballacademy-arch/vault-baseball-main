# VAULT™ OS — Codemagic Cloud Build Configuration
# 
# HOW TO USE:
# 1. Push this entire project to a GitHub repository
# 2. Go to codemagic.io and sign up FREE
# 3. Connect your GitHub repo
# 4. Codemagic auto-detects this file and builds your app
# 5. Download .ipa (iOS) and .aab (Android) from the dashboard
# 6. Upload to App Store Connect and Google Play Console
#
# FREE TIER: 500 build minutes/month — enough for 8-10 builds

workflows:

  # ══════════════════════════════════════════════════
  # iOS BUILD — produces .ipa for App Store
  # ══════════════════════════════════════════════════
  ios-app-store:
    name: VAULT OS — iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: VAULT_APP_STORE_CONNECT  # Set up in Codemagic dashboard
    
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.vaultbaseball.os
        APP_STORE_APP_ID: $APP_STORE_APP_ID  # Set in Codemagic env vars
      node: v20.11.0
    
    scripts:
      - name: Install dependencies
        script: npm ci
      
      - name: Build web app
        script: npm run build:prod
      
      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli
      
      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      
      - name: Sync Capacitor
        script: npx cap sync ios
      
      - name: Install CocoaPods
        script: cd ios/App && pod install
      
      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APP_ID") + 1))
          cd ios/App && agvtool new-version -all $BUILD_NUMBER
      
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false  # Set to true when ready for full release

  # ══════════════════════════════════════════════════
  # ANDROID BUILD — produces .aab for Google Play
  # ══════════════════════════════════════════════════
  android-google-play:
    name: VAULT OS — Android Google Play Build
    max_build_duration: 60
    instance_type: linux_x2
    
    environment:
      android_signing:
        - vault_keystore  # Upload your keystore in Codemagic dashboard
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
      node: v20.11.0
      java: 17
    
    scripts:
      - name: Install dependencies
        script: npm ci
      
      - name: Build web app
        script: npm run build:prod
      
      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli
      
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      
      - name: Sync Capacitor
        script: npx cap sync android
      
      - name: Copy Android config files
        script: |
          cp android-config/network_security_config.xml android/app/src/main/res/xml/
          mkdir -p android/app/src/main/res/drawable
          cp android-config/splash.xml android/app/src/main/res/drawable/
          cp android-config/styles.xml android/app/src/main/res/values/
      
      - name: Set version
        script: |
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=alpha,beta,production)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then BUILD_NUMBER=1; else BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1)); fi
          cd android && sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal  # Start with internal testing
        submit_as_draft: true
