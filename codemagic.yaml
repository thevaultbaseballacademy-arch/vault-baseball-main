workflows:
  android-release:
    name: VAULT OS Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - vault_keystore
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
            node: v22.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - emejia2291@gmail.com
        notify:
          success: true
          failure: true
  ios-app-store:
    name: VAULT OS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VAULT_APP_STORE_CONNECT
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: v20.11.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app
        script: CI=false npm run build
      - name: Install Capacitor
        script: npm install -g @capacitor/cli
      - name: Add iOS
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install pods
        script: cd ios/App && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
