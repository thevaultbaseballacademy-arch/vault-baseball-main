workflows:

  ios-app-store:
    name: VAULT OS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VAULT_APP_STORE_CONNECT
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vaultbaseball.os
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.vaultbaseball.os
        APP_STORE_APP_ID: $APP_STORE_APP_ID
      node: 22.11.0
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Patch all critical files
        script: |
          sed -i 's/limitsNavigationsToAppBoundDomains: true/limitsNavigationsToAppBoundDomains: false/' capacitor.config.ts
          sed -i 's|const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;|const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL ?? "https://hhvdxkxaiauzikavtpuj.supabase.co";|' src/integrations/supabase/client.ts
          sed -i 's|const SUPABASE_PUBLISHABLE_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;|const SUPABASE_PUBLISHABLE_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY ?? "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8";|' src/integrations/supabase/client.ts
          sed -i 's/const \[isLoading, setIsLoading\] = useState(true)/const [isLoading, setIsLoading] = useState(false)/' src/contexts/SubscriptionContext.tsx
          sed -i 's/const \[loading, setLoading\] = useState(true)/const [loading, setLoading] = useState(false)/' src/contexts/SportContext.tsx
          sed -i 's/loading: true,/loading: false,/' src/contexts/SportContext.tsx
          sed -i 's/isChecking: true,/isChecking: false,/' src/hooks/useBiometricAuth.ts
          printf 'import { Toaster as Sonner, toast } from "sonner";\ntype ToasterProps = React.ComponentProps<typeof Sonner>;\nconst Toaster = ({ ...props }: ToasterProps) => {\n  return (\n    <Sonner\n      theme="dark"\n      className="toaster group"\n      toastOptions={{\n        classNames: {\n          toast: "group toast group-[.toaster]:bg-background group-[.toaster]:text-foreground group-[.toaster]:border-border group-[.toaster]:shadow-lg",\n          description: "group-[.toast]:text-muted-foreground",\n          actionButton: "group-[.toast]:bg-primary group-[.toast]:text-primary-foreground",\n          cancelButton: "group-[.toast]:bg-muted group-[.toast]:text-muted-foreground",\n        },\n      }}\n      {...props}\n    />\n  );\n};\nexport { Toaster, toast };\n' > src/components/ui/sonner.tsx
          printf '<!doctype html>\n<html lang="en">\n  <head>\n    <meta charset="UTF-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />\n    <title>VAULT OS</title>\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n    <meta name="apple-mobile-web-app-title" content="VAULT OS" />\n    <meta name="mobile-web-app-capable" content="yes" />\n    <meta name="theme-color" content="#0d0d0d" />\n    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />\n    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />\n    <link rel="manifest" href="/manifest.json" />\n  </head>\n  <body>\n    <div id="root"></div>\n    <script type="module" src="/src/main.tsx"></script>\n  </body>\n</html>\n' > index.html
          echo "ALL PATCHES DONE"
      - name: Build web app
        script: |
          export VITE_SUPABASE_URL="https://hhvdxkxaiauzikavtpuj.supabase.co"
          export VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8"
          npm run build:prod
      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli
      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set app icon
        script: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp public/icons/icon-1024x1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/icon-1024x1024.png
          printf '{"images":[{"filename":"icon-1024x1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo "Icon set"
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APP_ID") + 1))
          cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-google-play:
    name: VAULT OS Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - vault_keystore
      vars:
        PACKAGE_NAME: com.vaultbaseball.os
      node: 22.11.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Patch all critical files
        script: |
          sed -i 's/limitsNavigationsToAppBoundDomains: true/limitsNavigationsToAppBoundDomains: false/' capacitor.config.ts
          sed -i 's|const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;|const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL ?? "https://hhvdxkxaiauzikavtpuj.supabase.co";|' src/integrations/supabase/client.ts
          sed -i 's|const SUPABASE_PUBLISHABLE_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;|const SUPABASE_PUBLISHABLE_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY ?? "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8";|' src/integrations/supabase/client.ts
          sed -i 's/const \[isLoading, setIsLoading\] = useState(true)/const [isLoading, setIsLoading] = useState(false)/' src/contexts/SubscriptionContext.tsx
          sed -i 's/const \[loading, setLoading\] = useState(true)/const [loading, setLoading] = useState(false)/' src/contexts/SportContext.tsx
          sed -i 's/loading: true,/loading: false,/' src/contexts/SportContext.tsx
          sed -i 's/isChecking: true,/isChecking: false,/' src/hooks/useBiometricAuth.ts
          printf 'import { Toaster as Sonner, toast } from "sonner";\ntype ToasterProps = React.ComponentProps<typeof Sonner>;\nconst Toaster = ({ ...props }: ToasterProps) => {\n  return (\n    <Sonner\n      theme="dark"\n      className="toaster group"\n      toastOptions={{\n        classNames: {\n          toast: "group toast group-[.toaster]:bg-background group-[.toaster]:text-foreground group-[.toaster]:border-border group-[.toaster]:shadow-lg",\n          description: "group-[.toast]:text-muted-foreground",\n          actionButton: "group-[.toast]:bg-primary group-[.toast]:text-primary-foreground",\n          cancelButton: "group-[.toast]:bg-muted group-[.toast]:text-muted-foreground",\n        },\n      }}\n      {...props}\n    />\n  );\n};\nexport { Toaster, toast };\n' > src/components/ui/sonner.tsx
          printf '<!doctype html>\n<html lang="en">\n  <head>\n    <meta charset="UTF-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />\n    <title>VAULT OS</title>\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n    <meta name="apple-mobile-web-app-title" content="VAULT OS" />\n    <meta name="mobile-web-app-capable" content="yes" />\n    <meta name="theme-color" content="#0d0d0d" />\n    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />\n    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />\n    <link rel="manifest" href="/manifest.json" />\n  </head>\n  <body>\n    <div id="root"></div>\n    <script type="module" src="/src/main.tsx"></script>\n  </body>\n</html>\n' > index.html
          echo "ALL PATCHES DONE"
      - name: Build web app
        script: |
          export VITE_SUPABASE_URL="https://hhvdxkxaiauzikavtpuj.supabase.co"
          export VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodmR4a3hhaWF1emlrYXZ0cHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4Njg2ODcsImV4cCI6MjA4MjQ0NDY4N30.ysBpLbWYe8y1wZLkztWltQBjdCfOw_z6U91tpYdPfK8"
          npm run build:prod
      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Copy Android config files
        script: |
          cp android-config/network_security_config.xml android/app/src/main/res/xml/
          mkdir -p android/app/src/main/res/drawable
          cp android-config/splash.xml android/app/src/main/res/drawable/
          cp android-config/styles.xml android/app/src/main/res/values/
      - name: Set version
        script: |
          cd android
          sed -i 's/versionCode [0-9]*/versionCode 4/' app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.3"/' app/build.gradle
      - name: Build Android AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - Emejia2291@gmail.com
        notify:
          success: true
          failure: true
