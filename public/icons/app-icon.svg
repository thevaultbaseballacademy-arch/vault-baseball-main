<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c848;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4a223;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  
  <!-- Diamond/V shape - the VAULT mark -->
  <polygon points="512,160 760,440 512,560 264,440" fill="url(#accent)" opacity="0.15"/>
  
  <!-- V letterform - bold geometric -->
  <path d="M220 280 L390 700 L512 500 L634 700 L804 280 L704 280 L512 620 L320 280 Z" 
        fill="url(#accent)" />
  
  <!-- Baseball stitching accent - subtle arc -->
  <path d="M420 780 Q512 820 604 780" stroke="#e8c848" stroke-width="8" fill="none" opacity="0.6"/>
  <path d="M440 800 Q512 840 584 800" stroke="#e8c848" stroke-width="5" fill="none" opacity="0.3"/>
  
  <!-- VAULT text below -->
  <text x="512" y="920" 
        font-family="Arial Black, sans-serif" 
        font-size="88" 
        font-weight="900"
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="12">VAULT</text>
        
  <!-- OS small text -->
  <text x="512" y="970" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="400"
        fill="#e8c848" 
        text-anchor="middle"
        letter-spacing="18" 
        opacity="0.8">OS</text>
</svg>